                        type: boolean
                    type: object
                  routeDistinguisher:
                    description: Route Distinguisher for the Interconnect service
                      instance. Required when redundant DCGWs are used.
                    properties:
                      administrator:
                        default: Auto
                        description: Administrator part of the route distinguisher.
                          Use a 4-byte dotted quad notation (e.g. 1.2.3.4), or `Auto`
                          keyword to use a system IP.
                        pattern: ^(Auto|(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]))$
                        type: string
                      assignedNumber:
                        default: Auto
                        description: Assigned number part of the route distinguisher.
                          Use a 2-byte integer (e.g. 12345), or `Auto` to use the
                          corresponding EVI or pool (if specified in the assignedNumberPool).
                        pattern: ^(Auto|0|[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$

                      assignedNumberPool:
                        description: Reference to a pool to use for the Assigned Number
                          allocation. Takes precedence over assignedNumber.
                        minLength: 1
                        type: string
                    type: object
                  vxlan:
                    description: VXLAN encapsulation options. Only applicable if VXLAN
                      encapsulation is used.
                    properties:
                      tunnelIndexPool:
                        default: tunnel-index-pool
                        description: Reference to tunnel index allocation pool.
                        type: string
                      vni:
                        description: VNI for the service instance.
                        format: int32
                        maximum: 16777215
                        minimum: 1
                        type: integer
                    type: object
                required:
                - encapsulation
                type: object
              nodeSelectors:
                description: Label selector to select nodes on which to configure
                  the BridgeDomainInterconnect.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              nodes:
                description: List of nodes (gateways) on which to configure the BridgeDomainInterconnect.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              primaryBGPInstance:
                description: Additional BGP Service Instance parameters related to
                  the primary BGP service Instance. Required when redundant DCGWs
                  are used.
                properties:
                  routeDistinguisher:
                    description: Route Distinguisher for the service instance. Required
                      when redundant DCGWs are used.
                    properties:
                      administrator:
                        default: Auto
                        description: Administrator part of the route distinguisher.
                          Use a 4-byte dotted quad notation (e.g. 1.2.3.4), or `Auto`
                          keyword to use a system IP.
                        pattern: ^(Auto|(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]))$
                        type: string
                      assignedNumber:
                        default: Auto
                        description: Assigned number part of the route distinguisher.
                          Use a 2-byte integer (e.g. 12345), or `Auto` to use the
                          corresponding EVI or pool (if specified in the assignedNumberPool).
                        pattern: ^(Auto|0|[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$
                        type: string
                      assignedNumberPool:
                        description: Reference to a pool to use for the Assigned Number
                          allocation. Takes precedence over assignedNumber.
                        minLength: 1
                        type: string
                    type: object
                required:
                - routeDistinguisher
                type: object
            required:
            - bridgeDomainRef
            - interconnectBGPInstance
            type: object
          status:
            description: BridgeDomainInterconnectStatus defines the observed state
              of BridgeDomainInterconnect
            properties:
              health:
                description: Indicates the health score of the BridgeDomainInterconnect.
                format: int32
                maximum: 100
                type: integer
              healthScoreReason:
                description: Explains the reason for the health score.
                type: string
              lastChangeTime:
                description: Timestamp of the last state change.
                type: string
              nodes:
                description: List of nodes on which the BridgeDomainInterconnect is
                  deployed.
                items:
                  type: string
                type: array
              operationalState:
                description: Operational state of the BridgeDomainInterconnect.
                enum:
                - Up
                - Down
                - Degraded
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

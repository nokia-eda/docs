apiVersion: core.eda.nokia.com/v1
kind: Manifest
metadata:
  name: fabrics
spec:
  group: fabrics.eda.nokia.com
  version: v1
  title: Fabrics
  description: |
    This application provides automation resources relating to datacenter fabrics.
  image: ghcr.io/nokia-eda/apps/fabrics:v7.0.0
  gitReference: 1da44402c90fbeba1161ccb8ea3350ef0353843d
  gitPathPrefix: /
  author: Nokia
  appInfo:
    categories:
      - "networking"
    documentation: fabrics/docs
  supportedEndpoints:
    - "srl:24.10.*"
    - "srl:25.3.*"
    - "srl:25.7.*"
    - "srl:25.10.*"
    - "srl:26.3.*"
    - "sros:24.10.r4+"
    - "sros:25.3.r2+"
    - "sros:25.7.*"
    - "sros:25.10.*"
    - "sros:26.3.*"
    - "eos:4.33.2f:beta"
    - "nxos:10.5.2:alpha"
  supportedCoreVersions:
    - "v6.0"
  components:
    - crd:
        path: fabrics/crds/fabrics.eda.nokia.com_fabrics.yaml
        schema: fabrics/openapiv3/eda_oas_fabrics.eda.nokia.com_fabrics.json
        ui:
          category: Fabrics
          name: Fabrics
          icon: SiteMap
        api:
          expose: readWrite
        conversionScript: fabrics/intents/fabric/conversion_v1.py
    - crd:
        path: fabrics/crds/fabrics.eda.nokia.com_isls.yaml
        schema: fabrics/openapiv3/eda_oas_fabrics.eda.nokia.com_isls.json
        ui:
          category: Fabrics
          name: ISLs
          icon: Link
        api:
          expose: readWrite
        conversionScript: fabrics/intents/isl/conversion_v1.py
    - crd:
        path: fabrics/crds/fabrics.eda.nokia.com_islstates.yaml
        schema: fabrics/openapiv3/eda_oas_fabrics.eda.nokia.com_islstates.json
        api:
          expose: none
        conversionScript: fabrics/intents/islstate/conversion_v1.py
    - crd:
        path: fabrics/crds/fabrics.eda.nokia.com_fabricstates.yaml
        schema: fabrics/openapiv3/eda_oas_fabrics.eda.nokia.com_fabricstates.json
        api:
          expose: none
        conversionScript: fabrics/intents/fabricstate/conversion_v1.py
    - script:
        path: fabrics/intents/fabric/fabric_intent.py
        type: config
        trigger:
          kind: Fabric
    - script:
        path: fabrics/intents/fabricstate/fabricstate_intent.py
        type: state
        trigger:
          kind: FabricState
    - script:
        path: fabrics/intents/isl/isl_intent.py
        type: config
        trigger:
          kind: ISL
    - script:
        path: fabrics/intents/islstate/islstate_intent.py
        type: state
        trigger:
          kind: ISLState
    - view:
        path: fabrics/ui/fabric-dashboard.json
        ui:
          category: Fabrics
          name: Fabrics
    - crd:
        api:
          expose: readWrite
        namespaced: true
        path: fabrics/crds/fabrics.eda.nokia.com_islpings.yaml
        schema: fabrics/openapiv3/eda_oas_fabrics.eda.nokia.com_islpings.json
        workflow: true
        ui:
          name: ISL Ping
          category: Troubleshooting
        conversionScript: fabrics/intents/islping/conversion_v1.py
    - crd:
        api:
          expose: readWrite
        namespaced: true
        path: fabrics/crds/fabrics.eda.nokia.com_fabrictopologies.yaml
        schema: fabrics/openapiv3/eda_oas_fabrics.eda.nokia.com_fabrictopologies.json
        workflow: true
        ui:
          name: Fabric Topology
          category: Topology
    - cr:
        path: fabrics/workflows/islping/core_v1_flowdefinition.yaml
    - cr:
        path: fabrics/workflows/fabrictopology/core_v1_flowdefinition.yaml
    - cr:
        path: fabrics/alarms/alarms.yaml
  dependencies:
    - file:
        path: fabrics/intents
    - file:
        path: fabrics/api
    - file:
        path: common/
    - file:
        path: utils/
    - file:
        path: protocols/api/v2/pysrc
    - file:
        path: routingpolicies/api/v1/pysrc
    - file:
        path: routing/api/v1/pysrc
    - file:
        path: routing/intents/defaultinterface/common.py
    - file:
        path: interfaces/api/v1/pysrc
    - file:
        path: qos/api/v2/pysrc
    - file:
        path: security/api/v1/pysrc
    - file:
        path: fabrics/alarms/pysrc
    - file:
        path: fabrics/api/v1/pysrc
    - container:
        image: registry.eda.dev/fabrics/workflows/islping:latest
        name: islping
    - container:
        image: registry.eda.dev/fabrics/workflows/fabrictopology:latest
        name: fabrictopology
  requirements:
    - appId: protocols.eda.nokia.com
      version: v7.0.0
    - appId: routingpolicies.eda.nokia.com
      version: v7.0.0
    - appId: routing.eda.nokia.com
      version: v7.0.0
    - appId: interfaces.eda.nokia.com
      version: v7.0.0
    - appId: qos.eda.nokia.com
      version: v7.0.0
    - appId: security.eda.nokia.com
      version: v7.0.0

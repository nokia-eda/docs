---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ztps.os.eda.nokia.com
spec:
  group: os.eda.nokia.com
  names:
    kind: ZTP
    listKind: ZTPList
    plural: ztps
    singular: ztp
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: ZTP is the Schema for the ztps API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZTPSpec defines the desired state of ZTP
            properties:
              autoBoot:
                default: false
                description: |-
                  The AutoBoot field is a boolean which controls whether the nodes should be using ZTP to auto-boot after reboot.
                  There are a number of caveats to be aware of when using this field:
                  In case of SRLinux:
                      AutoBoot=true: this will create a ConfigLet for the specified nodes for JSPath .system.boot.autoboot with value admin-state: enable
                      AutoBoot=false: this will delete the (previously created) ConfigLet for the specified nodes, however a user-defined lower priority ConfigLet may still exist.
                  In case of SROS:
                      AutoBoot=true: this will toggle .bof.auto-boot.dhcp.ipv4 and .bof.auto-boot.dhcp.ipv6 to true for the specified SROS nodes
                      AutoBoot=false: this will toggle .bof.auto-boot.dhcp.ipv4 and .bof.auto-boot.dhcp.ipv6 to false for the specified SROS nodes
                  In case of SROS and dual CPMs, we will create a ConfigLet for the specified sros nodes for JSPath .configure.redundancy with value synchronize: boot-env
                type: boolean
              nodeSelectors:
                description: |-
                  List of node selectors to select nodes to alter ZTP/AutoBoot settings.
                  This is a list of label expressions, e.g. ["eda.nokia.com/role=leaf"].
                items:
                  type: string
                type: array
              nodes:
                description: List of nodes to alter ZTP/AutoBoot settings for.
                items:
                  type: string
                type: array
            required:
            - autoBoot
            type: object
          status:
            description: ZTPStatus defines the observed state of ZTP
            properties:
              details:
                description: Per-node ztp details.
                items:
                  description: ZTPResultDetail defines per-node details of the ZTP
                    operation, such as which nodes were affected and any errors that
                    occurred during the operation.
                  properties:
                    error:
                      description: Error message if the operation was unsuccessful
                        for this node.
                      type: string
                    node:
                      description: The name of the node this result is for.
                      type: string
                    success:
                      description: |-
                        Indicates if the imaging operation was successful for this node.
                        This is true if the imaging operation was successful, false if it failed.
                      type: boolean
                  type: object
                type: array
              result:
                description: |-
                  Result is the overall result of the image operation.
                  It can be one of the following values:
                  - "Success": All images were successfully deployed.
                  - "Failed": No images were successfully deployed.
                  - "PartialSuccess": Some images were successfully deployed, but not all.
                enum:
                - Success
                - Failed
                - PartialSuccess
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

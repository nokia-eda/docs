---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: bots.discord.eda.nokia.com
spec:
  group: discord.eda.nokia.com
  names:
    kind: Bot
    listKind: BotList
    plural: bots
    shortNames:
    - bot
    singular: bot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.connected
      name: Connected
      type: boolean
    - jsonPath: .spec.serverID
      name: Server
      type: string
    - jsonPath: .status.serverName
      name: ServerName
      priority: 1
      type: string
    - jsonPath: .status.sessionID
      name: Session
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Bot is the Schema for the bots API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BotSpec defines the desired state of Bot.

              A Bot is bound to exactly one Discord server (guild). To target
              multiple servers, create one Bot CR per server. This keeps
              notification fan-out, RBAC and rate-limit accounting per-server and
              avoids a single bot becoming a multi-tenant routing layer.
            properties:
              allowDMs:
                default: false
                description: Allow direct messages from users.
                type: boolean
              allowedChannels:
                description: |-
                  Channels in the server this bot is allowed to read messages from
                  and post into. Notifications and slash commands are restricted
                  to this list.
                items:
                  type: string
                type: array
              presence:
                description: |-
                  Presence (status / activity) the bot should maintain while
                  connected.
                properties:
                  activityType:
                    description: Activity type of the bot.
                    enum:
                    - playing
                    - streaming
                    - listening
                    - watching
                    - competing
                    type: string
                  status:
                    description: Status of the bot.
                    enum:
                    - online
                    - idle
                    - dnd
                    - invisible
                    type: string
                  text:
                    description: Free-form activity text, e.g., "with CRDs".
                    type: string
                type: object
              serverDescription:
                description: Free-form description of the server, shown in the UI.
                type: string
              serverID:
                description: Discord server (guild) ID this bot is bound to.
                type: string
              tokenRef:
                description: Reference to the Kubernetes Secret holding the bot token.
                properties:
                  key:
                    description: Key inside the Secret holding the value.
                    type: string
                  name:
                    description: Name of the Secret.
                    type: string
                required:
                - key
                - name
                type: object
            required:
            - allowedChannels
            - serverID
            - tokenRef
            type: object
          status:
            description: BotStatus defines the observed state of Bot.
            properties:
              connected:
                description: Connected status of the bot
                type: boolean
              error:
                description: Error message
                type: string
              lastHeartbeat:
                description: |-
                  LastHeartbeat is the timestamp of the last successful gateway
                  heartbeat acknowledged by Discord.
                format: date-time
                type: string
              serverName:
                description: ServerName resolved from .spec.serverID at connect time.
                type: string
              sessionID:
                description: SessionID of the current Discord gateway session, if
                  connected.
                type: string
            required:
            - connected
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SourceSpec defines the desired state of Source
            properties:
              facilities:
                description: Syslog facilities that messages will be sourced from.
                  When left empty, every facility is matched.
                items:
                  description: Facility selects logs by syslog-style facility for
                    a given operating system and severity comparison.
                  properties:
                    facility:
                      default: All
                      description: Facility name or identifier used when matching
                        log records for this operating system.
                      enum:
                      - All
                      - Kernel
                      - User
                      - Mail
                      - Daemon
                      - Auth
                      - Syslog
                      - LPR
                      - News
                      - UUCP
                      - Cron
                      - AuthPriv
                      - FTP
                      - NTP
                      - LogAudit
                      - LogAlert
                      - Clock
                      - Local0
                      - Local1
                      - Local2
                      - Local3
                      - Local4
                      - Local5
                      - Local6
                      - Local7
                      type: string
                    severity:
                      description: Severity level used together with the severity
                        operator when evaluating log records for this facility.
                      enum:
                      - Debug
                      - Informational
                      - Notice
                      - Warning
                      - Error
                      - Critical
                      - Alert
                      - Emergency
                      type: string
                    severityOperator:
                      description: How log record severity is compared to the configured
                        Severity for this facility (at or above the level, or exactly
                        that level).
                      enum:
                      - Minimum
                      - Exact
                      type: string
                  required:
                  - severityOperator
                  type: object
                type: array
              messageFiltering:
                description: 'Optional message filtering: evaluate log message text
                  against filter rules and allow or deny forwarding based on the match
                  mode.'
                properties:
                  matchMode:
                    default: Allow
                    description: Whether log messages that match the filter rules
                      are forwarded or blocked.
                    enum:
                    - Allow
                    - Deny
                    type: string
                  rules:
                    description: Filter rules applied to log message text. If the
                      message matches at least one rule, it is forwarded or blocked
                      according to the match mode.
                    items:
                      description: MessageRule defines one text match entry used for
                        message filtering.
                      properties:
                        operator:
                          description: How Text is matched against the log message
                            for filtering.
                          enum:
                          - StartsWith
                          - Contains
                          - Regex
                          type: string
                        text:
                          description: Text or pattern compared to the log message
                            using Operator.
                          type: string
                      required:
                      - operator
                      - text
                      type: object
                    type: array
                type: object
              subsystems:
                description: Which subsystems to include in the log records. If no
                  subsystems are selected, all subsystems will be included.
                properties:
                  extensions:
                    description: Used to define more granular and OS-specific subsystems.
                    properties:

  name: destinations.logging.eda.nokia.com
spec:
  group: logging.eda.nokia.com
  names:
    kind: Destination
    listKind: DestinationList
    plural: destinations
    singular: destination
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Destination is the Schema for the Destinations API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DestinationSpec defines the desired state of Destination
            properties:
              file:
                description: Settings for a file log target.
                properties:
                  location:
                    description: Path to location where log files are written. Refer
                      to the documentation for default and allowed values.
                    type: string
                type: object
              rotation:
                description: Rotation settings for a Memory or File destination.
                properties:
                  maxEntries:
                    description: Maximum number of log entries kept in the in-memory
